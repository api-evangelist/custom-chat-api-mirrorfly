apis:
- name: MirrorFly Chat Platform API
  description: Token-authenticated REST API for building in-app chat, split into User APIs and Admin APIs (users,
    contacts, recent/history chat, groups, media, metadata, presence, block/unblock, call logs, device token). Uses
    versioned /api/v1/ paths against a customer-specific instance base URL; bearer token valid up to 1 hour.
  humanURL: https://www.mirrorfly.com/docs/platformapi/overview/
